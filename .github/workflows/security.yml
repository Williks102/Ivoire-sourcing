name: Sécurité
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dépendances de production (bloquant dès « high »)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
      - name: Secrets dans le code
        run: |
          if git grep -nE "(AIza[0-9A-Za-z_-]{35}|standard_[0-9a-f]{40,}|sk-[A-Za-z0-9]{32,})" -- . ':!package-lock.json'; then
            echo "Secret probable détecté"; exit 1; fi
